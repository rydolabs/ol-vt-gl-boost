name: R69 npm lockfile and runtime reproduction probe
on:
  push:
    branches: [refactor/r69-vendor-npm-lock]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lock-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile with pinned OpenLayers 10.10.0 packages
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile is already pinned
        run: git diff --exit-code -- package-lock.json
      - name: Install exactly from generated lockfile and stage runtime
        run: npm ci --no-audit --no-fund
      - name: Check 17 regressions and original source contracts
        run: |
          npm test
          npm run test:contract
          npm run test:examples
          npm run test:facade
          npm run test:compat
          npm run test:vendor
      - name: Verify generated runtime and package licenses
        run: |
          npm run test:vendor
      - name: Keep candidate lockfile and runtime manifest for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r69-npm-lockfile-candidate-${{ matrix.os }}
          path: |
            package-lock.json
            artifacts/r69-patch-audit.json
            vendor/openlayers-10.10.0-runtime/GENERATED_MANIFEST.json
          retention-days: 30
          if-no-files-found: warn
