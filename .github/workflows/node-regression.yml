name: Core Regression (Ubuntu and Windows)
on:
  push:
    branches: [main, refactor/r64-functional-layout]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore pinned OpenLayers runtime via npm ci
        run: npm ci --no-audit --no-fund
      - name: Verify 17 core CPU/Worker regressions
        run: npm test
      - name: Verify default OFF, R48 fallback, and original/new source bytes
        run: npm run test:contract

      - name: Validate side-by-side OL 10.10.0 and Boost example
        run: npm run test:examples

      - name: Verify unified facade API
        run: npm run test:facade

      - name: Verify legacy compatibility module consolidation
        run: npm run test:compat

      - name: Verify R73 exclusive renderer and fail-closed facade lifecycle
        run: npm run test:r73

      - name: Validate lockfile-based vendor overlay runtime
        run: npm run test:vendor
