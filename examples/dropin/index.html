<script type="module">
import Map from '../../src/ol/BoostMap.js';
import View from '../../vendor/openlayers-10.10.0-runtime/node_modules/ol/View.js';
import Projection from '../../vendor/openlayers-10.10.0-runtime/node_modules/ol/proj/Projection.js';
import {addProjection} from '../../vendor/openlayers-10.10.0-runtime/node_modules/ol/proj.js';
import TileGrid from '../../vendor/openlayers-10.10.0-runtime/node_modules/ol/tilegrid/TileGrid.js';
import MVT from '../../vendor/openlayers-10.10.0-runtime/node_modules/ol/format/MVT.js';
import VectorTileSource from '../../vendor/openlayers-10.10.0-runtime/node_modules/ol/source/VectorTile.js';
import WebGLVectorTileLayer from '../../vendor/openlayers-10.10.0-runtime/node_modules/ol/layer/WebGLVectorTile.js';

const report={ready:false,errors:[],loaded:0};
globalThis.__r76=report;
const status=document.getElementById('status');
const publish=()=>status.textContent=JSON.stringify(report,null,2);
addEventListener('error',e=>{report.errors.push(String(e.error||e.message));publish();});
addEventListener('unhandledrejection',e=>{report.errors.push(String(e.reason));publish();});
try {
 const response=await fetch('/tests/fixtures/r46-data/manifest.json');
 if(!response.ok)throw Error('Run npm run test:rtx:prepare');
 const manifest=await response.json();
 if(manifest.sources?.length!==32)throw Error('Expected independent MVT fixture manifest');
 const count=Math.min(50,Math.max(1,Number(new URLSearchParams(location.search).get('count')||8)));
 const selected=Array.from({length:count},(_,i)=>manifest.sources[i%32]);
 const tiles=new globalThis.Map();
 for(const part of selected){
   const key=part.x+'/'+part.y;
   if(tiles.has(key))continue;
   const response=await fetch('/tests/fixtures/r46-data/tiles/12/'+key+'.pbf');
   if(!response.ok)throw Error('Missing tile '+key);
   tiles.set(key,await response.arrayBuffer());
 }
 const projection=new Projection({code:'OLVT:LOCAL',units:'m',extent:[0,0,32768,16384]});
 addProjection(projection);
 const tileGrid=new TileGrid({extent:[0,0,32768,16384],origin:[0,16384],resolutions:[64],tileSize:64});
 const view=new View({projection,center:[16384,8192],resolution:64,constrainResolution:false});
 const layers=selected.map((part,index)=>{
   const format=new MVT({layers:[part.layer]});
   const source=new VectorTileSource({
     format,tileGrid,projection,wrapX:false,transition:0,
     tileUrlFunction:([,x,y])=>x===index%8&&y===Math.floor(index%32/8)?part.x+'/'+part.y:undefined,
     tileLoadFunction:(tile,url)=>tile.setLoader((extent,resolution,featureProjection)=>{
       const bytes=tiles.get(url);
       if(!bytes){tile.setState(3);report.errors.push('Missing tile '+url);publish();return;}
       try{tile.setFeatures(format.readFeatures(bytes.slice(0),{extent,featureProjection}));report.loaded++;}
       catch(error){tile.setState(3);report.errors.push(String(error));publish();}
     })
   });
   const style=part.layer==='transportation'
     ?{'stroke-color':'rgba(220,65,55,0.92)','stroke-width':3}
     :{'fill-color':'rgba(210,194,169,0.52)','stroke-color':'#766655','stroke-width':1};
   return new WebGLVectorTileLayer({source,style,disableHitDetection:true});
 });
 const map=new Map({target:document.getElementById('map'),layers,view,controls:[]});
 Object.assign(report,{map,layers,view,initialCenter:[...view.getCenter()],
   initialResolution:view.getResolution(),initialStatus:map.getBoostStatus(),
   expectedLayers:count,ready:true});
 map.renderSync();publish();
} catch(error){report.errors.push(String(error?.stack||error));publish();}
